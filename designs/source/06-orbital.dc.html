<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Euclid — Orbital</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0918;font-family:"Sora",system-ui,sans-serif;color:#F2F0FF}
a{color:#3FE3FF}a:hover{color:#9CF1FF}
.glass{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);border-radius:26px;backdrop-filter:blur(18px)}
.gb{font-family:"Sora",system-ui,sans-serif;font-size:14px;font-weight:600;min-height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#F2F0FF;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 800px; background: #0A0918; overflow: hidden">
  <div style="position: absolute; left: 60px; top: 120px; width: 460px; height: 460px; border-radius: 50%; background: #FF4FD8; opacity: .18; filter: blur(110px)"></div>
  <div style="position: absolute; left: 340px; top: 320px; width: 420px; height: 420px; border-radius: 50%; background: #3FE3FF; opacity: .14; filter: blur(110px)"></div>

  <!-- the plane -->
  <div style="position: absolute; left: 10px; top: 110px; width: 740px; height: 600px; perspective: 1500px">
    <div style="position: absolute; left: 110px; top: 40px; width: 520px; height: 520px; transform: rotateX(56deg) rotateZ(-38deg); border-radius: 30px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.28); box-shadow: 0 0 90px rgba(140,110,255,.28), inset 0 0 60px rgba(255,255,255,.05)">
      <sc-for list="{{lines}}" as="l" hint-placeholder-count="16">
        <div style="position: absolute; left: {{l.left}}px; top: {{l.top}}px; width: {{l.w}}px; height: {{l.h}}px; background: rgba(255,255,255,.12)"></div>
      </sc-for>
      <sc-for list="{{squares}}" as="q" hint-placeholder-count="5">
        <div style="position: absolute; box-sizing: border-box; left: {{q.left}}px; top: {{q.top}}px; width: {{q.size}}px; height: {{q.size}}px; transform: rotate({{q.angle}}deg); border-radius: 8px; border: 2px solid {{q.color}}; background: {{q.fill}}; box-shadow: 0 0 22px {{q.color}}"></div>
      </sc-for>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
        <sc-if value="{{c.empty}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: rgba(255,255,255,.38)"></div>
        </sc-if>
        <sc-if value="{{c.a}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFE0F7, #FF4FD8 48%, #9C1C86); box-shadow: 0 0 26px rgba(255,79,216,.85)"></div>
        </sc-if>
        <sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #E6FDFF, #3FE3FF 48%, #0B7F96); box-shadow: 0 0 26px rgba(63,227,255,.8); display: flex; align-items: center; justify-content: center">
            <div style="width: 11px; height: 11px; border-radius: 50%; background: #0A0918"></div>
          </div>
        </sc-if>
        <sc-if value="{{c.last}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; border: 1.5px solid rgba(63,227,255,.8); box-sizing: border-box"></div>
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; border: 1px solid rgba(63,227,255,.35); box-sizing: border-box"></div>
        </sc-if>
      </sc-for>
    </div>
  </div>

  <!-- HUD -->
  <div style="position: absolute; left: 60px; top: 50px; display: flex; align-items: baseline; gap: 18px">
    <div style="font-size: 30px; font-weight: 200; letter-spacing: .6em">EUCLID</div>
    <div style="font-size: 13px; font-weight: 300; color: #B9B5D6">a game in two colours of light</div>
  </div>

  <div style="position: absolute; left: 790px; top: 60px; width: 350px; display: flex; flex-direction: column; gap: 18px">
    <div class="glass" style="padding: 24px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="position: relative; width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(#FF4FD8 0 18%, rgba(255,255,255,.09) 18% 100%); box-shadow: 0 0 30px rgba(255,79,216,.35)">
          <div style="position: absolute; inset: 9px; border-radius: 50%; background: #13112A; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <div style="font-size: 44px; font-weight: 300; line-height: 1">27</div>
            <div style="font-size: 11px; color: #B9B5D6">of 150</div>
          </div>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #FF8FE6">You</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="position: relative; width: 132px; height: 132px; border-radius: 50%; background: conic-gradient(#3FE3FF 0 19.3%, rgba(255,255,255,.09) 19.3% 100%); box-shadow: 0 0 30px rgba(63,227,255,.3)">
          <div style="position: absolute; inset: 9px; border-radius: 50%; background: #13112A; display: flex; flex-direction: column; align-items: center; justify-content: center">
            <div style="font-size: 44px; font-weight: 300; line-height: 1">29</div>
            <div style="font-size: 11px; color: #B9B5D6">of 150</div>
          </div>
        </div>
        <div style="font-size: 14px; font-weight: 600; color: #8CEFFF">Euclid</div>
      </div>
    </div>
    <div class="glass" style="padding: 20px 24px; display: flex; align-items: center; gap: 14px">
      <div style="width: 12px; height: 12px; border-radius: 50%; background: #FF4FD8; box-shadow: 0 0 14px #FF4FD8"></div>
      <div style="flex-grow: 1">
        <div style="font-size: 18px; font-weight: 600">Your move</div>
        <div style="font-size: 13px; color: #B9B5D6">Euclid lit H6</div>
      </div>
    </div>
    <div class="glass" style="padding: 18px 24px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; font-size: 14px">
          <div style="width: 8px; height: 8px; border-radius: 50%; background: {{r.color}}; box-shadow: 0 0 8px {{r.color}}"></div>
          <div style="width: 44px; font-weight: 600">{{r.cell}}</div>
          <div style="flex-grow: 1; color: #B9B5D6">{{r.who}}</div>
          <div style="font-weight: 600; color: #FFFFFF">{{r.plus}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; gap: 10px">
      <button class="gb">Hint</button>
      <button class="gb">Squares</button>
      <button class="gb" style="background: #FF4FD8; border-color: #FF4FD8; color: #1A0716">New game</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
var EU_POS = {
  p: [[0,0,2],[5,0,1],[1,1,1],[2,1,2],[3,1,1],[6,1,1],[5,2,2],[7,2,2],[1,3,1],[2,3,2],[3,3,1],[6,3,1],[4,4,1],[1,5,1],[3,5,1],[5,5,1],[6,5,2],[0,6,2],[3,6,2],[4,6,1],[6,6,2],[7,6,2],[6,7,2],[7,7,2]],
  s: [[[[3,3],[3,1],[1,1],[1,3]],1,7,3],[[[2,3],[5,2],[6,5],[3,6]],2,8,5],[[[4,6],[3,5],[4,4],[5,5]],1,17,3],[[[6,6],[7,6],[7,7],[6,7]],2,20,2],[[[1,5],[1,3],[3,3],[3,5]],1,21,3]],
  log: [[1,1,1,0],[2,5,2,0],[1,1,3,0],[2,6,5,0],[1,3,1,0],[2,3,6,0],[1,3,3,9],[2,2,3,25],[1,6,1,0],[2,0,6,0],[1,5,5,0],[2,7,7,0],[1,4,4,0],[2,0,0,0],[1,3,5,0],[2,6,7,0],[1,4,6,9],[2,7,6,0],[1,6,3,0],[2,6,6,4],[1,1,5,9],[2,2,1,0],[1,5,0,0],[2,7,2,0]]
};
function euLayout(P, M, T) {
  var cols = 'ABCDEFGH', occ = {}, cells = [], lines = [], labels = [];
  EU_POS.p.forEach(function (q) { occ[q[0] + ',' + q[1]] = q[2]; });
  for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
    var o = occ[x + ',' + y] || 0;
    cells.push({ x: M + x * P, y: M + y * P, a: o === 1, b: o === 2, empty: !o, last: x === 7 && y === 2 });
  }
  for (var k = 0; k < 8; k++) {
    lines.push({ left: M, top: M + k * P - T / 2, w: 7 * P, h: T });
    lines.push({ left: M + k * P - T / 2, top: M, w: T, h: 7 * P });
    labels.push({ pos: M + k * P, col: cols.charAt(k), row: String(8 - k) });
  }
  var squares = EU_POS.s.map(function (q) {
    var c = q[0], cx = 0, cy = 0;
    c.forEach(function (p) { cx += p[0] / 4; cy += p[1] / 4; });
    var dx = c[1][0] - c[0][0], dy = c[1][1] - c[0][1], size = Math.sqrt(dx * dx + dy * dy) * P;
    return { left: M + cx * P - size / 2, top: M + cy * P - size / 2, size: size, angle: Math.atan2(dy, dx) * 180 / Math.PI, a: q[1] === 1, b: q[1] === 2, fresh: q[2] === 21, side: q[3], pts: q[3] * q[3], cx: M + cx * P, cy: M + cy * P };
  });
  var log = EU_POS.log.map(function (e, i) { return { n: i + 1, a: e[0] === 1, b: e[0] === 2, cell: cols.charAt(e[1]) + (8 - e[2]), pts: e[3], plus: e[3] ? '+' + e[3] : '' }; }).reverse();
  return { cells: cells, lines: lines, squares: squares, log: log, labels: labels };
}
class Component extends DCLogic {
  renderVals() {
    var L = euLayout(64, 36, 1);
    L.squares.forEach(function (q) {
      q.color = q.fresh ? '#FFFFFF' : q.a ? '#FF4FD8' : '#3FE3FF';
      q.fill = q.fresh ? 'rgba(255,255,255,.14)' : q.a ? 'rgba(255,79,216,.10)' : 'rgba(63,227,255,.08)';
    });
    var recent = L.log.slice(0, 4).map(function (r) { return { cell: r.cell, who: r.a ? 'You' : 'Euclid', color: r.a ? '#FF4FD8' : '#3FE3FF', plus: r.plus }; });
    return { cells: L.cells, lines: L.lines, squares: L.squares, recent: recent };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Euclid — Phosphor</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#030703;font-family:"VT323",ui-monospace,monospace;color:#7CFF9B}
a{color:#FFB547}a:hover{color:#FFD08A}
.glow{text-shadow:0 0 6px rgba(124,255,155,.65),0 0 18px rgba(124,255,155,.25)}
.scan{background:repeating-linear-gradient(rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.cursor{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fk{font-family:"VT323",ui-monospace,monospace;font-size:24px;min-height:44px;padding:0 16px;border:0;background:#7CFF9B;color:#031003;cursor:pointer}
.fk span{opacity:.7}
</style>
</helmet>
<div class="glow" style="position: relative; width: 1200px; height: 800px; background: #041004; overflow: hidden; box-shadow: inset 0 0 160px rgba(0,0,0,.95)">
  <!-- status bar -->
  <div style="position: absolute; left: 0; top: 0; width: 1200px; height: 40px; background: #7CFF9B; color: #031003; display: flex; align-items: center; gap: 22px; padding: 0 22px; box-sizing: border-box; font-size: 25px; text-shadow: none">
    <span>EUCLID 0.2.5</span><span>│</span><span>tty1</span><span>│</span><span>PRACTICE 8x8</span><span>│</span><span>FOOTPRINT</span><span>│</span><span>TARGET 150</span>
  </div>

  <!-- board -->
  <div style="position: absolute; left: 50px; top: 80px; width: 600px; height: 620px">
    <sc-for list="{{labels}}" as="lb" hint-placeholder-count="8">
      <div style="position: absolute; top: 0; left: {{lb.x}}px; width: 20px; margin-left: -10px; text-align: center; font-size: 26px">{{lb.col}}</div>
      <div style="position: absolute; left: 0; top: {{lb.y}}px; height: 26px; margin-top: -13px; line-height: 26px; font-size: 26px">{{lb.row}}</div>
    </sc-for>
    <div style="position: absolute; left: 30px; top: 36px; width: 560px; height: 560px; border: 4px double #7CFF9B; box-sizing: border-box; box-shadow: 0 0 12px rgba(124,255,155,.35)">
      <sc-for list="{{squares}}" as="q" hint-placeholder-count="5">
        <div style="position: absolute; box-sizing: border-box; left: {{q.left}}px; top: {{q.top}}px; width: {{q.size}}px; height: {{q.size}}px; transform: rotate({{q.angle}}deg); border: 2px {{q.style}} {{q.color}}; box-shadow: 0 0 10px {{q.color}}"></div>
      </sc-for>
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
        <sc-if value="{{c.empty}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 4px; height: 4px; margin: -2px 0 0 -2px; background: #7CFF9B; opacity: .55"></div>
        </sc-if>
        <sc-if value="{{c.a}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 26px; height: 26px; margin: -13px 0 0 -13px; background: #7CFF9B; box-shadow: 0 0 14px rgba(124,255,155,.8)"></div>
        </sc-if>
        <sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 4px solid #7CFF9B; box-sizing: border-box; box-shadow: 0 0 10px rgba(124,255,155,.6), inset 0 0 6px rgba(124,255,155,.5)"></div>
        </sc-if>
        <sc-if value="{{c.last}}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 34px; height: 4px; margin: 20px 0 0 -17px; background: #FFB547; box-shadow: 0 0 10px #FFB547"></div>
        </sc-if>
      </sc-for>
    </div>
    <div style="position: absolute; left: 30px; top: 600px; font-size: 22px; opacity: .8">■ YOU (solid)    □ EUCLID (hollow)    ▬ last move</div>
  </div>

  <!-- terminal pane -->
  <div style="position: absolute; left: 700px; top: 80px; width: 460px; height: 620px; font-size: 26px; line-height: 1.22; display: flex; flex-direction: column; gap: 2px">
    <div>euclid&gt; status</div>
    <div style="white-space: pre">  YOU     {{barA}} 027/150</div>
    <div style="white-space: pre">  EUCLID  {{barB}} 029/150</div>
    <div style="height: 14px"></div>
    <div>euclid&gt; history --last 7</div>
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="7">
      <div style="white-space: pre; color: {{r.color}}">{{r.line}}</div>
    </sc-for>
    <div style="height: 14px"></div>
    <div style="white-space: pre">EUCLID played H6. Your move.</div>
    <div style="display: flex; align-items: center">euclid&gt; place&#160;<span style="display: inline-block; width: 13px; height: 24px; background: #7CFF9B"></span></div>
  </div>

  <!-- function keys -->
  <div style="position: absolute; left: 50px; top: 738px; display: flex; gap: 14px; text-shadow: none">
    <button class="fk"><span>F1</span> HINT</button>
    <button class="fk"><span>F2</span> LINES</button>
    <button class="fk"><span>F3</span> NEW</button>
    <button class="fk"><span>F10</span> QUIT</button>
  </div>

  <div class="scan" style="position: absolute; inset: 0; pointer-events: none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
var EU_POS = {
  p: [[0,0,2],[5,0,1],[1,1,1],[2,1,2],[3,1,1],[6,1,1],[5,2,2],[7,2,2],[1,3,1],[2,3,2],[3,3,1],[6,3,1],[4,4,1],[1,5,1],[3,5,1],[5,5,1],[6,5,2],[0,6,2],[3,6,2],[4,6,1],[6,6,2],[7,6,2],[6,7,2],[7,7,2]],
  s: [[[[3,3],[3,1],[1,1],[1,3]],1,7,3],[[[2,3],[5,2],[6,5],[3,6]],2,8,5],[[[4,6],[3,5],[4,4],[5,5]],1,17,3],[[[6,6],[7,6],[7,7],[6,7]],2,20,2],[[[1,5],[1,3],[3,3],[3,5]],1,21,3]],
  log: [[1,1,1,0],[2,5,2,0],[1,1,3,0],[2,6,5,0],[1,3,1,0],[2,3,6,0],[1,3,3,9],[2,2,3,25],[1,6,1,0],[2,0,6,0],[1,5,5,0],[2,7,7,0],[1,4,4,0],[2,0,0,0],[1,3,5,0],[2,6,7,0],[1,4,6,9],[2,7,6,0],[1,6,3,0],[2,6,6,4],[1,1,5,9],[2,2,1,0],[1,5,0,0],[2,7,2,0]]
};
function euLayout(P, M, T) {
  var cols = 'ABCDEFGH', occ = {}, cells = [], lines = [], labels = [];
  EU_POS.p.forEach(function (q) { occ[q[0] + ',' + q[1]] = q[2]; });
  for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
    var o = occ[x + ',' + y] || 0;
    cells.push({ x: M + x * P, y: M + y * P, a: o === 1, b: o === 2, empty: !o, last: x === 7 && y === 2 });
  }
  for (var k = 0; k < 8; k++) {
    lines.push({ left: M, top: M + k * P - T / 2, w: 7 * P, h: T });
    lines.push({ left: M + k * P - T / 2, top: M, w: T, h: 7 * P });
    labels.push({ pos: M + k * P, col: cols.charAt(k), row: String(8 - k) });
  }
  var squares = EU_POS.s.map(function (q) {
    var c = q[0], cx = 0, cy = 0;
    c.forEach(function (p) { cx += p[0] / 4; cy += p[1] / 4; });
    var dx = c[1][0] - c[0][0], dy = c[1][1] - c[0][1], size = Math.sqrt(dx * dx + dy * dy) * P;
    return { left: M + cx * P - size / 2, top: M + cy * P - size / 2, size: size, angle: Math.atan2(dy, dx) * 180 / Math.PI, a: q[1] === 1, b: q[1] === 2, fresh: q[2] === 21, side: q[3], pts: q[3] * q[3], cx: M + cx * P, cy: M + cy * P };
  });
  var log = EU_POS.log.map(function (e, i) { return { n: i + 1, a: e[0] === 1, b: e[0] === 2, cell: cols.charAt(e[1]) + (8 - e[2]), pts: e[3], plus: e[3] ? '+' + e[3] : '' }; }).reverse();
  return { cells: cells, lines: lines, squares: squares, log: log, labels: labels };
}
function bar(v) {
  var n = Math.round(v / 150 * 16), s = '';
  for (var i = 0; i < 16; i++) s += i < n ? '█' : '·';
  return s;
}
class Component extends DCLogic {
  renderVals() {
    var L = euLayout(70, 31, 1);
    L.squares.forEach(function (q) {
      q.color = q.fresh ? '#FFB547' : '#7CFF9B';
      q.style = q.a ? 'solid' : 'dashed';
    });
    var labels = L.labels.map(function (lb) { return { col: lb.col, row: lb.row, x: 30 + lb.pos, y: 36 + lb.pos }; });
    var recent = L.log.slice(0, 7).map(function (r) {
      var n = ('00' + r.n).slice(-3);
      var who = r.a ? 'YOU   ' : 'EUCLID';
      var extra = r.pts ? '  SQUARE ' + Math.sqrt(r.pts) + 'x' + Math.sqrt(r.pts) + ' +' + r.pts : '';
      return { line: '  ' + n + '  ' + who + '  ' + r.cell + extra, color: r.pts ? '#FFB547' : '#7CFF9B' };
    });
    return { cells: L.cells, squares: L.squares, labels: labels, recent: recent, barA: bar(27), barB: bar(29) };
  }
}
</script>
</body>
</html>

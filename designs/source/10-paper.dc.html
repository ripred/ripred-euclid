<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Euclid — Paper</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#C8A26E;font-family:"Patrick Hand",system-ui,sans-serif;color:#2B2118}
a{color:#B63D1C}a:hover{color:#7E2A13}
.kraft{background-color:#C8A26E;background-image:repeating-linear-gradient(33deg,rgba(90,60,25,.07) 0 1px,transparent 1px 6px),repeating-linear-gradient(-58deg,rgba(255,240,210,.09) 0 1px,transparent 1px 9px)}
.tape{background:repeating-linear-gradient(45deg,rgba(255,170,190,.75) 0 7px,rgba(255,245,240,.75) 7px 14px)}
.tape2{background:repeating-linear-gradient(-45deg,rgba(140,205,195,.75) 0 7px,rgba(245,255,250,.75) 7px 14px)}
.pb{font-family:"Caveat Brush",cursive;font-size:24px;min-height:52px;padding:0 24px;border:0;background:#F6EFE0;color:#2B2118;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 10px rgba(60,35,10,.25)}
</style>
</helmet>
<div class="kraft" style="position: relative; width: 1200px; height: 800px; overflow: hidden">
  <!-- stacked sheets -->
  <div style="position: absolute; left: 70px; top: 96px; width: 600px; height: 600px; background: #1F7A74; transform: rotate(3deg); box-shadow: 0 6px 14px rgba(60,35,10,.3)"></div>
  <div style="position: absolute; left: 62px; top: 92px; width: 600px; height: 600px; background: #E4572E; transform: rotate(-3.5deg); box-shadow: 0 6px 14px rgba(60,35,10,.3)"></div>
  <div style="position: absolute; left: 60px; top: 90px; width: 600px; height: 600px; background: #F6EFE0; transform: rotate(-1deg); box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 14px 28px rgba(60,35,10,.35)">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="16">
      <div style="position: absolute; left: {{l.left}}px; top: {{l.top}}px; width: {{l.w}}px; height: {{l.h}}px; background: rgba(60,50,40,.22)"></div>
    </sc-for>
    <sc-for list="{{squares}}" as="q" hint-placeholder-count="5">
      <div style="position: absolute; box-sizing: border-box; left: {{q.left}}px; top: {{q.top}}px; width: {{q.size}}px; height: {{q.size}}px; transform: rotate({{q.angle}}deg); border: 7px solid {{q.color}}; box-shadow: 0 2px 3px rgba(60,35,10,.3), inset 0 2px 3px rgba(60,35,10,.22)"></div>
    </sc-for>
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="64">
      <sc-if value="{{c.empty}}" hint-placeholder-val="{{ true }}">
        <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; border: 1.5px solid rgba(60,50,40,.45); box-sizing: border-box"></div>
      </sc-if>
      <sc-if value="{{c.a}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #E4572E; box-shadow: 0 2px 0 rgba(0,0,0,.14), 0 5px 8px rgba(60,35,10,.35)"></div>
      </sc-if>
      <sc-if value="{{c.b}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; background: #1F7A74; box-shadow: 0 2px 0 rgba(0,0,0,.14), 0 5px 8px rgba(60,35,10,.35); display: flex; align-items: center; justify-content: center">
          <div style="width: 12px; height: 12px; border-radius: 50%; background: #F6EFE0; box-shadow: inset 0 1px 2px rgba(0,0,0,.35)"></div>
        </div>
      </sc-if>
      <sc-if value="{{c.last}}" hint-placeholder-val="{{ false }}">
        <div style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; border: 2.5px dashed #2B2118; box-sizing: border-box"></div>
      </sc-if>
    </sc-for>
  </div>
  <div class="tape" style="position: absolute; left: 20px; top: 76px; width: 130px; height: 32px; transform: rotate(-38deg)"></div>
  <div class="tape2" style="position: absolute; left: 580px; top: 660px; width: 130px; height: 32px; transform: rotate(-35deg)"></div>

  <!-- right side -->
  <div style="position: absolute; left: 730px; top: 58px; display: flex; flex-direction: column; gap: 4px">
    <div style="font-family: 'Caveat Brush', cursive; font-size: 120px; line-height: .9; color: #2B2118">Euclid</div>
    <div style="width: 300px; height: 16px; background: #E4572E; transform: rotate(-2deg); box-shadow: 0 3px 5px rgba(60,35,10,.3)"></div>
  </div>

  <div style="position: absolute; left: 736px; top: 238px; width: 200px; height: 150px; background: #F6EFE0; clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); transform: rotate(-4deg); filter: drop-shadow(0 6px 8px rgba(60,35,10,.35))">
    <div style="position: absolute; left: 22px; top: 67px; width: 16px; height: 16px; border-radius: 50%; background: #C8A26E"></div>
    <div style="position: absolute; left: 60px; top: 14px; font-size: 24px; color: #B63D1C">you</div>
    <div style="position: absolute; left: 60px; top: 38px; font-family: 'Caveat Brush', cursive; font-size: 88px; line-height: 1; color: #E4572E">27</div>
  </div>
  <div style="position: absolute; left: 950px; top: 250px; width: 200px; height: 150px; background: #F6EFE0; clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); transform: rotate(3deg); filter: drop-shadow(0 6px 8px rgba(60,35,10,.35))">
    <div style="position: absolute; left: 22px; top: 67px; width: 16px; height: 16px; border-radius: 50%; background: #C8A26E"></div>
    <div style="position: absolute; left: 60px; top: 14px; font-size: 24px; color: #155955">Euclid</div>
    <div style="position: absolute; left: 60px; top: 38px; font-family: 'Caveat Brush', cursive; font-size: 88px; line-height: 1; color: #1F7A74">29</div>
  </div>

  <!-- sticky note -->
  <div style="position: absolute; left: 760px; top: 440px; width: 250px; padding: 20px 22px; background: #F5D35C; transform: rotate(2.5deg); box-shadow: 0 10px 16px rgba(60,35,10,.3); display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Caveat Brush', cursive; font-size: 30px; line-height: 1">your turn!</div>
    <sc-for list="{{recent}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px; font-size: 21px">
        <div style="width: 54px">{{r.cell}}</div>
        <div style="flex-grow: 1">{{r.who}}</div>
        <div style="color: #B63D1C">{{r.plus}}</div>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; left: 736px; top: 700px; display: flex; gap: 16px">
    <button class="pb" style="transform: rotate(-2deg)">hint</button>
    <button class="pb" style="transform: rotate(1.5deg)">squares</button>
    <button class="pb" style="transform: rotate(-1deg); background: #E4572E; color: #FFFFFF">new game</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":800}}'>
var EU_POS = {
  p: [[0,0,2],[5,0,1],[1,1,1],[2,1,2],[3,1,1],[6,1,1],[5,2,2],[7,2,2],[1,3,1],[2,3,2],[3,3,1],[6,3,1],[4,4,1],[1,5,1],[3,5,1],[5,5,1],[6,5,2],[0,6,2],[3,6,2],[4,6,1],[6,6,2],[7,6,2],[6,7,2],[7,7,2]],
  s: [[[[3,3],[3,1],[1,1],[1,3]],1,7,3],[[[2,3],[5,2],[6,5],[3,6]],2,8,5],[[[4,6],[3,5],[4,4],[5,5]],1,17,3],[[[6,6],[7,6],[7,7],[6,7]],2,20,2],[[[1,5],[1,3],[3,3],[3,5]],1,21,3]],
  log: [[1,1,1,0],[2,5,2,0],[1,1,3,0],[2,6,5,0],[1,3,1,0],[2,3,6,0],[1,3,3,9],[2,2,3,25],[1,6,1,0],[2,0,6,0],[1,5,5,0],[2,7,7,0],[1,4,4,0],[2,0,0,0],[1,3,5,0],[2,6,7,0],[1,4,6,9],[2,7,6,0],[1,6,3,0],[2,6,6,4],[1,1,5,9],[2,2,1,0],[1,5,0,0],[2,7,2,0]]
};
function euLayout(P, M, T) {
  var cols = 'ABCDEFGH', occ = {}, cells = [], lines = [], labels = [];
  EU_POS.p.forEach(function (q) { occ[q[0] + ',' + q[1]] = q[2]; });
  for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) {
    var o = occ[x + ',' + y] || 0;
    cells.push({ x: M + x * P, y: M + y * P, a: o === 1, b: o === 2, empty: !o, last: x === 7 && y === 2 });
  }
  for (var k = 0; k < 8; k++) {
    lines.push({ left: M, top: M + k * P - T / 2, w: 7 * P, h: T });
    lines.push({ left: M + k * P - T / 2, top: M, w: T, h: 7 * P });
    labels.push({ pos: M + k * P, col: cols.charAt(k), row: String(8 - k) });
  }
  var squares = EU_POS.s.map(function (q) {
    var c = q[0], cx = 0, cy = 0;
    c.forEach(function (p) { cx += p[0] / 4; cy += p[1] / 4; });
    var dx = c[1][0] - c[0][0], dy = c[1][1] - c[0][1], size = Math.sqrt(dx * dx + dy * dy) * P;
    return { left: M + cx * P - size / 2, top: M + cy * P - size / 2, size: size, angle: Math.atan2(dy, dx) * 180 / Math.PI, a: q[1] === 1, b: q[1] === 2, fresh: q[2] === 21, side: q[3], pts: q[3] * q[3], cx: M + cx * P, cy: M + cy * P };
  });
  var log = EU_POS.log.map(function (e, i) { return { n: i + 1, a: e[0] === 1, b: e[0] === 2, cell: cols.charAt(e[1]) + (8 - e[2]), pts: e[3], plus: e[3] ? '+' + e[3] : '' }; }).reverse();
  return { cells: cells, lines: lines, squares: squares, log: log, labels: labels };
}
class Component extends DCLogic {
  renderVals() {
    var L = euLayout(74, 41, 1);
    L.squares.forEach(function (q) {
      q.color = q.fresh ? '#F5C84C' : q.a ? 'rgba(228,87,46,.88)' : 'rgba(31,122,116,.88)';
    });
    var recent = L.log.slice(0, 4).map(function (r) { return { cell: r.cell, who: r.a ? 'me' : 'Euclid', plus: r.plus }; });
    return { cells: L.cells, lines: L.lines, squares: L.squares, recent: recent };
  }
}
</script>
</body>
</html>

lipse class="board__piece-gloss" cx="0.3964" cy="2.352" rx="0.15539999999999998" ry="0.08879999999999999" transform="rotate(-24 0.3964 2.352)"></ellipse></g></g><g class="board__piece board__piece--1 "><circle class="board__piece-shadow" cx="2.55" cy="2.59" r="0.4366" fill="url(#R4-shadow)"></circle><g class="board__piece-body"><circle class="board__piece-disc" cx="2.5" cy="2.5" r="0.37" fill="url(#R4-p1)"></circle><circle class="board__piece-groove-light" cx="2.5" cy="2.525" r="0.185"></circle><circle class="board__piece-groove" cx="2.5" cy="2.5" r="0.185"></circle><ellipse class="board__piece-gloss" cx="2.3964" cy="2.352" rx="0.15539999999999998" ry="0.08879999999999999" transform="rotate(-24 2.3964 2.352)"></ellipse></g></g></svg></svg></svg>